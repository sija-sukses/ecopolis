<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -26 48 40" width="96" height="80" fill="none">
  <!-- Smooth ambient occlusion contact shadow under delivery van -->
  <polygon points="-16,1 -2,-6 17,4 3,11" fill="#0f172a" fill-opacity="0.35" />
  <!-- Isometric 3D wheels -->
  <ellipse cx="-7.5" cy="3.5" rx="3.3" ry="2.3" fill="#1e293b" />
  <ellipse cx="-7.5" cy="3.5" rx="1.5" ry="1.0" fill="#cbd5e1" />
  <ellipse cx="4.5" cy="9.5" rx="3.3" ry="2.3" fill="#1e293b" />
  <ellipse cx="4.5" cy="9.5" rx="1.5" ry="1.0" fill="#cbd5e1" />
  <!-- Rounded rear cargo van body (Soft Matte White/Silver Clay) -->
  <polygon points="-17,-1.8 -3,5.2 -3,-4.8 -17,-11.8" fill="#e2e8f0" />
  <polygon points="-3,5.2 10,-1.3 10,-11.3 -3,-4.8" fill="#cbd5e1" />
  <polygon points="-17,-11.8 -4,-18.3 10,-11.3 -3,-4.8" fill="#ffffff" />
  <!-- Zero-emission cyan-mint eco stripe on van side -->
  <polygon points="-15.5,-5.2 -4,0.6 -4,-1.4 -15.5,-7.2" fill="#06b6d4" />
  <polygon points="-15.5,-7.2 -4,-1.4 -4,-2.6 -15.5,-8.4" fill="#34d399" />
  <!-- Rounded aerodynamic front cab -->
  <polygon points="-3,5.2 4,8.7 4,1.2 -3,-2.4" fill="#e2e8f0" />
  <polygon points="4,8.7 17,2.2 17,-5.3 4,1.2" fill="#cbd5e1" />
  <polygon points="-3,-2.4 10,-8.9 17,-5.3 4,1.2" fill="#f8fafc" />
  <!-- Cab windshield & side window -->
  <polygon points="-2.2,2.2 3.4,5.0 3.4,1.2 -2.2,-1.6" fill="#1e293b" />
  <polygon points="4.8,5.2 15.6,-0.2 15.6,-4.2 4.8,1.2" fill="#0f172a" />
  <polygon points="6.0,3.8 14.2,-0.3 14.2,-3.2 6.0,0.9" fill="#7dd3fc" fill-opacity="0.45" />
  <!-- Crisp LED headlights -->
  <polygon points="5.4,7.4 8.6,5.8 8.6,4.4 5.4,6.0" fill="#fef08a" />
  <polygon points="12.6,3.8 15.8,2.2 15.8,0.8 12.6,2.4" fill="#fef08a" />
</svg>
