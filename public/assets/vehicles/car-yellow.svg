<svg xmlns="http://www.w3.org/2000/svg" viewBox="-22 -22 44 36" width="88" height="72" fill="none">
  <!-- Smooth ambient occlusion contact shadow under vehicle -->
  <polygon points="-14,1 -2,-6 15,3 3,10" fill="#0f172a" fill-opacity="0.34" />
  <!-- Isometric 3D wheels -->
  <ellipse cx="-6.5" cy="3.2" rx="3.2" ry="2.2" fill="#1e293b" />
  <ellipse cx="-6.5" cy="3.2" rx="1.4" ry="0.9" fill="#94a3b8" />
  <ellipse cx="4.2" cy="8.5" rx="3.2" ry="2.2" fill="#1e293b" />
  <ellipse cx="4.2" cy="8.5" rx="1.4" ry="0.9" fill="#94a3b8" />
  <!-- Lower chassis clay body (Sunny Yellow) -->
  <polygon points="-15,-1.5 -1,5.8 -1,0.2 -15,-7.0" fill="#facc15" />
  <polygon points="-1,5.8 13,-1.2 13,-6.8 -1,0.2" fill="#eab308" />
  <polygon points="-15,-7.0 -1,-14.0 13,-6.8 -1,0.2" fill="#fde047" />
  <!-- Soft rounded cabin greenhouse -->
  <polygon points="-9.5,-6.2 -1,-1.8 -1,-6.8 -8.2,-10.6" fill="#fde047" />
  <polygon points="-1,-1.8 7.5,-6.0 6.2,-10.4 -1,-6.8" fill="#ca8a04" />
  <polygon points="-8.2,-10.6 -1,-14.2 6.2,-10.4 -1,-6.8" fill="#fef08a" />
  <!-- Tinted clay windshield & side windows -->
  <polygon points="-8.6,-6.5 -1.4,-2.8 -1.4,-6.3 -7.6,-9.6" fill="#1e293b" />
  <polygon points="-0.6,-2.8 6.8,-6.4 5.6,-9.6 -0.6,-6.3" fill="#0f172a" />
  <polygon points="-7.2,-6.8 -2.2,-4.2 -2.2,-6.1 -6.5,-8.4" fill="#7dd3fc" fill-opacity="0.45" />
  <!-- Headlights & taillights -->
  <polygon points="2.2,3.4 5.4,1.8 5.4,0.4 2.2,2.0" fill="#ffffff" />
  <polygon points="8.4,0.3 11.4,-1.2 11.4,-2.6 8.4,-1.1" fill="#ffffff" />
  <polygon points="-14.2,-2.4 -11.5,-1.0 -11.5,-2.2 -14.2,-3.6" fill="#ef4444" />
</svg>
