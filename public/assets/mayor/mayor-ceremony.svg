<svg xmlns="http://www.w3.org/2000/svg" viewBox="-36 -48 72 60" width="72" height="60" fill="none">
  <!-- Bayangan kontak lembut di atas karpet merah -->
  <ellipse cx="0" cy="3" rx="14" ry="6.5" fill="#0f172a" opacity="0.28" />

  <!-- Kaki celana formal biru dongker (dark navy suit trousers) -->
  <polygon points="-5.2,0 -0.6,2.2 -0.6,-7.5 -5.2,-9.5" fill="#0f172a" />
  <polygon points="0.6,2.0 5.2,-0.2 5.2,-9.5 0.6,-7.5" fill="#1e293b" />
  <!-- Sepatu pantofel hitam mengilap -->
  <ellipse cx="-3.2" cy="1.2" rx="3.2" ry="1.6" fill="#090d16" />
  <ellipse cx="3.2" cy="1.0" rx="3.2" ry="1.6" fill="#090d16" />

  <!-- Jas Formal Dark Navy (3D clay bevel shading) -->
  <polygon points="-7.4,-8.2 0,-4.4 0,-18.8 -7.4,-22.4" fill="#1e293b" />
  <polygon points="7.4,-8.2 0,-4.4 0,-18.8 7.4,-22.4" fill="#0f172a" />
  <polygon points="0,-25.8 7.4,-22.4 0,-18.8 -7.4,-22.4" fill="#334155" />

  <!-- Kemeja putih & dasi merah formal -->
  <polygon points="-2.2,-21.5 0,-19.8 2.2,-21.5 0,-14.2" fill="#f8fafc" />
  <polygon points="-0.8,-19.8 0.8,-19.8 1.1,-12.5 0,-11.2 -1.1,-12.5" fill="#dc2626" />

  <!-- Selempang Kehormatan Merah (Honorary Red Sash) melintang dari bahu kiri ke pinggang kanan -->
  <polygon points="-6.2,-22.0 -3.2,-23.4 6.8,-10.2 4.2,-8.4" fill="#ef4444" />
  <polygon points="-5.4,-21.6 -4.0,-22.4 6.0,-9.6 4.8,-8.8" fill="#fca5a5" opacity="0.65" />
  <!-- Roset / Medali Emas Walikota di dada -->
  <circle cx="-3.4" cy="-16.2" r="2.1" fill="#fbbf24" stroke="#fef08a" stroke-width="0.6" />

  <!-- Kepala 3D Clay Stylized (Faceless / Toy Diorama Finish) -->
  <polygon points="-5.4,-20.4 0,-17.6 0,-26.6 -5.4,-29.2" fill="#f59e0b" opacity="0.15" />
  <polygon points="-5.2,-20.4 0,-17.6 0,-26.6 -5.2,-29.2" fill="#f3be96" />
  <polygon points="5.2,-20.4 0,-17.6 0,-26.6 5.2,-29.2" fill="#df9e70" />
  <polygon points="0,-31.8 5.2,-29.2 0,-26.6 -5.2,-29.2" fill="#fde0c6" />
  <polygon points="0,-31.8 5.2,-29.2 0,-26.6 -5.2,-29.2" fill="#fde0c6" />

  <!-- Rambut & Topi Kehormatan Navy-Emas Walikota -->
  <polygon points="-5.6,-27.2 0,-24.5 0,-30.5 -5.6,-33.2" fill="#1e293b" />
  <polygon points="5.6,-27.2 0,-24.5 0,-30.5 5.6,-33.2" fill="#0f172a" />
  <polygon points="0,-35.8 5.6,-33.2 0,-30.5 -5.6,-33.2" fill="#334155" />
  <!-- Pita emas topi kehormatan -->
  <polygon points="-5.7,-27.6 0,-24.9 5.7,-27.6 5.7,-29.0 0,-26.3 -5.7,-29.0" fill="#fbbf24" />

  <!-- Lengan Kiri & Kanan Memegang Gunting Seremonial Emas Raksasa -->
  <polygon points="-6.8,-19.2 -1.5,-13.8 -0.2,-15.6 -5.2,-21.0" fill="#1e293b" />
  <polygon points="6.8,-19.2 10.8,-14.2 8.8,-12.4 4.8,-17.4" fill="#0f172a" />
  <circle cx="9.8" cy="-13.2" r="2.1" fill="#f3be96" />
  <circle cx="-1.0" cy="-14.4" r="2.0" fill="#fde0c6" />

  <!-- Gunting Seremonial Emas Raksasa (Oversized Golden Ceremonial Scissors) -->
  <g transform="translate(8.5 -12.5) rotate(-14)">
    <!-- Bilah gunting emas atas & bawah terbuka memotong pita -->
    <polygon points="0,-1.2 15.5,-6.8 14.2,-2.2 0,1.2" fill="#fde047" stroke="#ca8a04" stroke-width="0.6" />
    <polygon points="0,1.2 15.8,4.6 14.0,0.4 0,-1.2" fill="#eab308" stroke="#a16207" stroke-width="0.6" />
    <!-- Baut poros tengah gunting permata merah -->
    <circle cx="2.2" cy="0" r="1.6" fill="#dc2626" stroke="#fef08a" stroke-width="0.6" />
    <!-- Gagang cincin emas kembar (golden ceremonial loops) -->
    <ellipse cx="-4.2" cy="-2.8" rx="3.8" ry="2.5" fill="none" stroke="#facc15" stroke-width="1.8" />
    <ellipse cx="-4.2" cy="2.8" rx="3.8" ry="2.5" fill="none" stroke="#eab308" stroke-width="1.8" />
    <!-- Kilau bintang emas di ujung gunting -->
    <polygon points="16.5,-5.5 18,-8.5 19.5,-5.5 22.5,-4 19.5,-2.5 18,0.5 16.5,-2.5 13.5,-4" fill="#fef9c3" />
  </g>
</svg>
