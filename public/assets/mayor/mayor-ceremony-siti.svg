<svg xmlns="http://www.w3.org/2000/svg" viewBox="-36 -48 72 60" width="72" height="60" fill="none" data-mayor-avatar="siti" data-mayor-mode="ceremony">
  <!-- Bayangan kontak di atas karpet merah -->
