  <polygon points="-5.0,-21.0 -3.6,-21.8 5.6,-9.2 4.4,-8.4" fill="#fca5a5" opacity="0.65" />
  <!-- Medali Emas Walikota -->
  <circle cx="-3.2" cy="-15.6" r="2.0" fill="#fbbf24" stroke="#fef08a" stroke-width="0.5" />

  <!-- Kepala 3D Clay Stylized -->
